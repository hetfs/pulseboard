# ======================================================
# PulseBoard Project — pyproject.toml
# Repository: https://github.com/hetfs/pulseboard
# Target: Python 3.14 (PEP 621 + Modern Toolchain)
# ======================================================

[build-system]
requires = [
  "setuptools>=80.9.0",
  "wheel>=0.45.1",
  "build>=1.3.0",
  "twine>=6.2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pulseboard"
version = "0.1.0"
description = "PulseBoard a modern, real-time dashboard built with FastAPI and Bokeh."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "HETFS LTD", email = "hetfs01@gmail.com" }]
maintainers = [{ name = "HETFS LTD", email = "hetfs01@gmail.com" }]
keywords = ["fastapi", "dashboard", "bokeh", "realtime", "pulseboard"]
classifiers = [
  "Development Status :: 4 Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "bokeh>=3.8.0",
  "fastapi[standard]>=0.121.0",
  "gunicorn>=23.0.0",
  "httptools>=0.7.1",
  "jinja2>=3.1.6",
  "numpy>=2.3.4",
  "pandas>=2.3.3",
  "psutil>=7.1.3",
  "python-dotenv>=1.0.1",
  "requests>=2.32.5",
  "uvicorn[standard]>=0.38.0",
  "uvloop>=0.22.1",
  "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = [
  "editorconfig-checker>=3.4.1",
  "flowmark>=0.5.7",
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.3",
  "yamllint>=1.37.1",
]
markdown = ["markdown>=3.10", "markdown2>=2.5.4", "markitdown[all]>=0.1.3"]

[project.urls]
Homepage = "https://github.com/hetfs/pulseboard"
Documentation = "https://github.com/hetfs/pulseboard/wiki"
Repository = "https://github.com/hetfs/pulseboard.git"
Issues = "https://github.com/hetfs/pulseboard/issues"

# --------------------------------------
# 🧰 Toolchain Configuration
# --------------------------------------

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pulseboard*"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
show_error_codes = true

[tool.ruff]
target-version = "py314"
line-length = 88
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.pre-commit]
default_stages = ["commit"]
repos = []

[tool.editorconfig-checker]
exclude = [".git", "__pycache__"]

[tool.yamllint]
extends = "default"

# --------------------------------------
# 🧪 Build Metadata
# --------------------------------------
[tool.build]
requires = ["build>=1.3.0"]
backend = "setuptools.build_meta"
